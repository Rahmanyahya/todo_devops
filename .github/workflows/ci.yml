name: Deployment Practice 1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    test:
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:16
          env:
            POSTGRES_DB: test_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready 
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
        
      steps:
        - name: Checkout code
          uses: actions/checkout@v2

        - name: Set up node
          uses: actions/setup-node@v2
          with:
            node-version: '20'
      
        - name: Install dependencies
          run: npm ci

        - name: Run Migrations
          env:
            DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          run: |
            npx prisma migrate deploy
            npx prisma generate
        
        - name: Run tests
          env:
            DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          run: npm run test
    
    build_and_publish:
        needs: test
        runs-on: ubuntu-latest
        environment: VPS_DEVOPS_TODO
        steps:
          - name: Checkout code
            uses: actions/checkout@v2

          - name: Login GHCR
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.TOKEN }}

          - name: Build Docker image
            run: |
              docker build . -t ghcr.io/rahmanyahya/todo_app:latest
            
          - name: Push Docker image
            run: |
              docker push ghcr.io/rahmanyahya/todo_app:latest

    deploy:
        needs: build_and_publish
        runs-on: ubuntu-latest
        environment: VPS_DEVOPS_TODO

        steps:
          - name: Deploy to Server
            uses: appleboy/ssh-action@v1.0.0
            with:
              host: ${{ secrets.SERVER_HOST }}
              username: ${{ secrets.SERVER_USER }}
              password: ${{ secrets.SERVER_PASSWORD }}
              port: 22
              script: |
                cd /home/${{ github.event.repository.name }}
                git pull origin main
                docker compose pull
                docker compose up -d


